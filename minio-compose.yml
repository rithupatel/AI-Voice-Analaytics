version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2023-05-18T00-05-36Z
    container_name: voice_analysis_minio
    network_mode: "host"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=adminpassword
    command: server /data --console-address ":9001"
    user: root
    privileged: true
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./data/minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc
    container_name: voice_analysis_minio_init
    network_mode: "host"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      sleep 5;
      mc alias set localminio http://localhost:9000 admin adminpassword;
      mc mb localminio/livekit-bucket || true;
      mc anonymous set download localminio/livekit-bucket;
      echo 'MinIO Bucket Configured!';
      "
